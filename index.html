<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>Math Research Tool</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #161512; color: #fff; font-family: sans-serif; }
        .nav { background: #262421; padding: 10px; display: flex; gap: 10px; align-items: center; justify-content: center; height: 50px; box-sizing: border-box; }
        input { width: 50%; padding: 8px; border-radius: 4px; border: 1px solid #3d3a35; background: #1c1a17; color: #fff; }
        button { background: #45a049; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        iframe { width: 100%; height: calc(100vh - 50px); border: none; }
    </style>
</head>
<body>
    <div class="nav">
        <span>🌐 萬能學術搜尋：</span>
        <input type="text" id="urlInput" placeholder="請輸入完整網址，例如 https://google.com">
        <button onclick="launchSite()">前往網站</button>
    </div>
    <!-- 預設下方依然是你剛剛架好的西洋棋網頁 -->
    <iframe id="proxyFrame" src="https://github.io"></iframe>

    <script>
        function launchSite() {
            var url = document.getElementById('urlInput').value.trim();
            if (url) {
                if (!/^https?:\/\//i.test(url)) { url = 'https://' + url; }
                // 利用 Google 翻譯的中繼網域強制渲染網頁，能穿透大部分學校封鎖
                document.getElementById('proxyFrame').src = "https://google.com" + encodeURIComponent(url);
            }
        }
    </script>
</body>
</html>
